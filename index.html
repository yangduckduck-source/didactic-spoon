<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex">
<!-- 이 파일은 scripts/build.py 가 app.html 에서 만든다. 직접 고치지 말 것. -->
<style>:root{color-scheme:light}body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style>
<title>작가의 서가</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@400;500;600&family=Noto+Serif+KR:wght@500;700&display=swap">
<style>
/* Layout: 왼쪽은 작가 연결망(초점 작가는 중앙에 크게, 지나온 작가는 왼쪽으로 밀리며 작아짐), 오른쪽은 노션식 작가 페이지 */
:root {
  --bg: #ffffff;
  --fg: #37352f;
  --muted: #787774;
  --faint: #a5a29b;
  --line: #ebeae6;
  --hover: #f3f2ef;
  --surface: #fbfaf8;
  --ink: #2c5a87;          /* 만년필 블루블랙 — 초점·링크 */
  --ink-soft: #e4ecf4;
  --edge: #d6d3cc;
  --edge-strong: #8fa6bd;
  /* 관계의 성격 — 선 색 */
  --k-admire: #7f98b2;
  --k-mentor: #3d8a5a;
  --k-rival: #c4473a;
  --k-trans: #c08a1e;
  --k-peer: #8a63b8;
  --k-homage: #9a6a45;
  --warn-bg: #fbf3db; --warn-fg: #7d6413;
  --font-display: "Noto Serif KR", "Nanum Myeongjo", "AppleMyungjo", Georgia, serif;
  --font-body: "IBM Plex Sans KR", -apple-system, "Apple SD Gothic Neo", "Malgun Gothic", system-ui, sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #191918; --fg: #e6e4df; --muted: #9b9891; --faint: #6d6a64; --line: #2c2b29;
    --hover: #252422; --surface: #1f1e1c; --ink: #8db7e0; --ink-soft: #1f3247;
    --edge: #3a3936; --edge-strong: #5c7a98;
    --k-admire: #7d9bbb; --k-mentor: #6cc08a; --k-rival: #ec7a6c; --k-trans: #e3b04b; --k-peer: #b393e0; --k-homage: #c89a72;
    --warn-bg: #3d351b; --warn-fg: #e6cf86;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #191918; --fg: #e6e4df; --muted: #9b9891; --faint: #6d6a64; --line: #2c2b29;
  --hover: #252422; --surface: #1f1e1c; --ink: #8db7e0; --ink-soft: #1f3247;
  --edge: #3a3936; --edge-strong: #5c7a98;
  --k-admire: #7d9bbb; --k-mentor: #6cc08a; --k-rival: #ec7a6c; --k-trans: #e3b04b; --k-peer: #b393e0; --k-homage: #c89a72;
  --warn-bg: #3d351b; --warn-fg: #e6cf86;
  color-scheme: dark;
}
html, body { height: 100%; }
body { background: var(--bg); color: var(--fg); font-family: var(--font-body); font-size: 14px; line-height: 1.6; }
* { box-sizing: border-box; }
button, input, select { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 2px solid var(--ink); outline-offset: 2px; border-radius: 4px; }

.app { height: 100%; display: grid; grid-template-rows: auto 1fr; grid-template-columns: minmax(0, 1fr); }
.topbar { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 12px; padding: 10px 16px; border-bottom: 1px solid var(--line); }
.brand { font-family: var(--font-display); font-weight: 700; font-size: 16px; letter-spacing: -0.01em; white-space: nowrap; margin-right: 4px; }
.brand small { font-family: var(--font-body); font-weight: 400; color: var(--muted); font-size: 12px; margin-left: 6px; }
.bar-form { display: flex; gap: 6px; min-width: 0; flex: 1 1 260px; max-width: 460px; }
.suggest { position: relative; flex: 1; min-width: 0; display: flex; }
.bar-form input { flex: 1; min-width: 0; width: 100%; border: 1px solid var(--line); background: var(--surface); border-radius: 6px; padding: 6px 10px; }
.suggest ul { position: absolute; top: calc(100% + 4px); left: 0; right: 0; z-index: 20; list-style: none; margin: 0; padding: 4px; background: var(--bg); border: 1px solid var(--line); border-radius: 6px; box-shadow: 0 6px 20px rgb(0 0 0 / .12); max-height: 280px; overflow-y: auto; }
.suggest li { padding: 5px 8px; border-radius: 4px; cursor: pointer; display: flex; justify-content: space-between; gap: 8px; }
.suggest li small { color: var(--faint); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.suggest li[aria-selected="true"], .suggest li:hover { background: var(--hover); }
.bar-form .arrow { align-self: center; color: var(--faint); }
.btn { border: 1px solid var(--line); background: var(--bg); border-radius: 6px; padding: 5px 10px; white-space: nowrap; }
.btn:hover { background: var(--hover); }
.btn.primary { background: var(--ink); border-color: var(--ink); color: var(--bg); }
.btn.primary:hover { filter: brightness(1.08); }
.btn.ghost { border-color: transparent; color: var(--muted); }
.btn:disabled { opacity: .5; cursor: default; }

.main { display: grid; grid-template-columns: minmax(0, 1fr) minmax(340px, 480px); min-height: 0; }
.stage { position: relative; min-height: 0; overflow: hidden; background:
  radial-gradient(circle at 1px 1px, var(--line) 1px, transparent 0) 0 0 / 22px 22px; }
.stage svg { width: 100%; height: 100%; display: block; touch-action: none; cursor: grab; }
.stage svg.dragging { cursor: grabbing; }
.legend { position: absolute; left: 12px; right: 12px; bottom: 10px; display: flex; flex-wrap: wrap; gap: 4px 6px; font-size: 12px; color: var(--muted); pointer-events: none; }
.legend > * { pointer-events: auto; }
.kind-toggle { flex: none; white-space: nowrap; display: inline-flex; align-items: center; gap: 6px; border: 1px solid var(--line); background: color-mix(in srgb, var(--bg) 88%, transparent); border-radius: 999px; padding: 2px 10px 2px 8px; font-size: 12px; color: var(--fg); }
.kind-toggle[aria-pressed="false"] { opacity: .4; }
.kind-toggle[aria-pressed="false"] svg { filter: grayscale(1); }
.legend .note-dot { flex: none; white-space: nowrap; display: inline-flex; align-items: center; gap: 5px; padding: 2px 8px; background: color-mix(in srgb, var(--bg) 88%, transparent); border-radius: 999px; }
.legend .note-dot i { width: 10px; height: 10px; border-radius: 50%; display: inline-block; }
.stage-tools { position: absolute; right: 12px; top: 12px; display: flex; gap: 6px; }

.node circle { stroke-width: 1.5; transition: fill .3s; }
.node text { font-family: var(--font-body); pointer-events: none; paint-order: stroke; stroke: var(--bg); stroke-width: 4px; stroke-linejoin: round; }
.node { cursor: pointer; }
.node:hover circle { stroke: var(--ink); }
.node.hl circle { stroke: var(--ink); stroke-width: 3; }

/* 노션식 페이지 */
.page { border-left: 1px solid var(--line); overflow-y: auto; min-height: 0; padding-block: 16px 48px; padding-inline: 28px; }
.crumbs { display: flex; flex-wrap: wrap; align-items: center; gap: 2px; font-size: 13px; color: var(--muted); margin-bottom: 28px; }
.crumbs button { border: 0; background: none; padding: 2px 6px; border-radius: 4px; color: var(--muted); }
.crumbs button:hover { background: var(--hover); color: var(--fg); }
.crumbs button[aria-current] { color: var(--fg); font-weight: 500; }
.crumbs .sep { color: var(--faint); font-size: 11px; display: inline-flex; align-items: center; gap: 2px; }
.page-icon { width: 64px; height: 64px; border-radius: 8px; display: grid; place-items: center; font-family: var(--font-display); font-size: 30px; font-weight: 700; background: var(--ink-soft); color: var(--ink); margin-bottom: 10px; }
h1 { font-family: var(--font-display); font-size: 30px; line-height: 1.25; margin: 0; font-weight: 700; text-wrap: balance; letter-spacing: -0.01em; }
.en { color: var(--muted); margin-top: 2px; }
.props { display: grid; grid-template-columns: 120px minmax(0,1fr); gap: 2px 8px; margin: 18px 0 6px; font-size: 13.5px; }
.props dt { color: var(--muted); padding: 3px 0; }
.props dd { margin: 0; padding: 3px 0; min-width: 0; }
hr.div { border: 0; border-top: 1px solid var(--line); margin: 18px 0; }
h2 { font-size: 15px; font-weight: 600; margin: 0 0 8px; display: flex; align-items: center; gap: 8px; }
h2 .count { color: var(--faint); font-weight: 400; }
.db-tools { display: flex; flex-wrap: wrap; gap: 6px; margin: 4px 0 10px; }
.db-tools:empty { display: none; }
.table-wrap { overflow-x: auto; border-top: 1px solid var(--line); }
table { border-collapse: collapse; width: 100%; font-size: 13px; min-width: 560px; }
th { text-align: left; font-weight: 400; color: var(--muted); padding: 6px 8px; border-bottom: 1px solid var(--line); white-space: nowrap; }
td { padding: 7px 8px; border-bottom: 1px solid var(--line); vertical-align: top; }
td + td, th + th { border-left: 1px solid var(--line); }
tr.row:hover td { background: var(--hover); }
.name-cell button { border: 0; background: none; padding: 0; text-align: left; font-weight: 500; color: var(--fg); text-decoration: underline; text-decoration-color: var(--edge); text-underline-offset: 3px; }
.name-cell button:hover { color: var(--ink); text-decoration-color: var(--ink); }
.name-cell .sub { display: block; color: var(--faint); font-size: 12px; }
.note { color: var(--muted); }
.kind { display: inline-flex; align-items: center; gap: 5px; white-space: nowrap; font-size: 12px; }
.medium { color: var(--muted); font-size: 12px; }
.origin { font-size: 11px; color: var(--faint); white-space: nowrap; }
.origin.ai, .origin.check { color: var(--warn-fg); }
.callout { display: flex; gap: 10px; background: var(--surface); border: 1px solid var(--line); border-radius: 6px; padding: 12px 14px; font-size: 13px; color: var(--muted); margin: 8px 0 12px; }
.callout b { color: var(--fg); font-weight: 500; }
.callout .mark { font-family: var(--font-display); color: var(--ink); font-weight: 700; }
.route { display: flex; flex-wrap: wrap; align-items: center; gap: 4px; margin-top: 6px; color: var(--fg); }
.status { font-size: 13px; color: var(--muted); display: flex; align-items: center; flex-wrap: wrap; gap: 8px; margin: 6px 0; }
.dot { width: 6px; height: 6px; border-radius: 50%; background: var(--ink); animation: pulse 1s infinite alternate; }
@keyframes pulse { to { opacity: .2; } }
@media (prefers-reduced-motion: reduce) { .dot { animation: none; } }
.backlinks { display: flex; flex-wrap: wrap; gap: 6px; }
.chip { border: 1px solid var(--line); background: var(--bg); border-radius: 999px; padding: 2px 10px; font-size: 13px; display: inline-flex; align-items: center; gap: 6px; }
.chip:hover { background: var(--hover); }
form.add { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; background: var(--surface); border: 1px solid var(--line); border-radius: 6px; padding: 10px; margin: 6px 0 12px; }
form.add input, form.add select { border: 1px solid var(--line); border-radius: 5px; padding: 5px 8px; background: var(--bg); min-width: 0; }
form.add .full { grid-column: 1 / -1; }
form.add .actions { grid-column: 1 / -1; display: flex; gap: 6px; justify-content: flex-end; }
.foot { margin-top: 28px; font-size: 12px; color: var(--faint); }
h1 .badge { display: inline-block; vertical-align: 6px; margin-left: 8px; font-family: var(--font-body); font-size: 11px; font-weight: 600; letter-spacing: .04em; color: var(--ink); background: var(--ink-soft); border-radius: 4px; padding: 1px 6px; }
h1 .badge.debut { color: var(--warn-fg); background: var(--warn-bg); }
.tnote { font-size: 12.5px; color: var(--muted); margin: 8px 0 0; }
.shelf { margin: 6px 0; }
.shelf summary { cursor: pointer; font-size: 15px; font-weight: 600; padding: 4px 0; list-style-position: outside; }
.shelf summary .count { color: var(--faint); font-weight: 400; }
.shelf .backlinks { padding: 8px 0 4px; }
.chip.on { border-color: var(--ink); color: var(--ink); }
.chip .n { font-size: 11px; color: var(--faint); }
.guide { border: 1px solid var(--line); background: var(--surface); border-radius: 8px; padding: 16px 18px; margin-bottom: 24px; font-size: 13.5px; }
.guide h3 { font-family: var(--font-display); font-size: 17px; margin: 0 0 6px; text-wrap: balance; }
.guide .tag-beta { display: inline-block; font-family: var(--font-body); font-size: 11px; font-weight: 600; letter-spacing: .06em; color: var(--ink); background: var(--ink-soft); border-radius: 4px; padding: 1px 6px; margin-left: 6px; vertical-align: 2px; }
.guide p { margin: 0 0 10px; color: var(--muted); }
.guide ol { margin: 0 0 12px; padding-left: 20px; display: grid; gap: 4px; }
.guide li::marker { color: var(--ink); font-weight: 600; }
.guide .send { border-top: 1px solid var(--line); padding-top: 10px; color: var(--muted); }
.guide .send b { color: var(--fg); font-weight: 500; }
.guide .actions { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 12px; }

@media (max-width: 860px) {
  .app { height: auto; }
  .main { grid-template-columns: minmax(0, 1fr); }
  .stage { height: 62vh; min-height: 420px; border-bottom: 1px solid var(--line); }
  .page { border-left: 0; padding-inline: 16px; overflow: visible; }
  .props { grid-template-columns: 96px minmax(0,1fr); }
}
</style>
</head>
<body>
<div class="app">
  <header class="topbar">
    <div class="brand">작가의 서가<small>누가 누구를 읽었나</small></div>
    <form class="bar-form" id="searchForm" autocomplete="off">
      <span class="suggest"><input id="q" placeholder="관심 있는 작가 (예: 윤동주, 보르헤스)" aria-label="작가 이름" autocomplete="off" spellcheck="false"></span>
      <button class="btn primary" type="submit">새 탐색</button>
    </form>
    <form class="bar-form" id="routeForm" autocomplete="off">
      <span class="suggest"><input id="r-from" placeholder="출발 작가" aria-label="출발 작가" autocomplete="off" spellcheck="false"></span>
      <span class="arrow" aria-hidden="true">→</span>
      <span class="suggest"><input id="r-to" placeholder="도착 작가" aria-label="도착 작가" autocomplete="off" spellcheck="false"></span>
      <button class="btn" type="submit">경로 찾기</button>
    </form>
    <button class="btn ghost" type="button" id="helpBtn">베타 안내</button>
  </header>
  <div class="main">
    <section class="stage" aria-label="작가 연결망">
      <svg id="graph" role="img" aria-label="작가 연결망 그래프"></svg>
      <div class="stage-tools">
        <button class="btn" id="back" type="button" title="한 단계 뒤로">← 뒤로</button>
        <button class="btn" id="recenter" type="button">초점으로</button>
      </div>
      <div class="legend" id="legend"></div>
    </section>
    <article class="page" id="page" aria-live="polite"></article>
  </div>
</div>

<script>
/* ───────────── 관계의 성격 ───────────── */
const KINDS = {
  애독: { label: "애독·찬사", color: "var(--k-admire)", dash: "", width: 1.4 },
  스승: { label: "스승·사숙", color: "var(--k-mentor)", dash: "", width: 3 },
  경쟁: { label: "경쟁·긴장", color: "var(--k-rival)", dash: "7 4", width: 1.8 },
  번역: { label: "번역", color: "var(--k-trans)", dash: "1 5", width: 2.6 },
  동료: { label: "동료·친구", color: "var(--k-peer)", dash: "10 3 2 3", width: 1.6 },
  오마주: { label: "작품 속 오마주", color: "var(--k-homage)", dash: "4 3", width: 1.6 },
};
const kindOf = k => KINDS[k] ? k : "애독";
const lineSwatch = (k, w = 26) => { const s = KINDS[kindOf(k)]; return `<svg width="${w}" height="8" aria-hidden="true"><line x1="1" y1="4" x2="${w - 1}" y2="4" stroke="${s.color}" stroke-width="${Math.min(s.width, 2.6)}" stroke-dasharray="${s.dash}" stroke-linecap="round"/></svg>`; };

/* ───────────── 시드 데이터 (프로토타입용 정리 — 원문 대조 필요) ───────────── */
const SEED_AUTHORS = [
  // id, 한글, 영문, 국적, 생몰, 별칭
  ["murakami","무라카미 하루키","Haruki Murakami","일본","1949–",["하루키","村上春樹","murakami"]],
  ["carver","레이먼드 카버","Raymond Carver","미국","1938–1988",["카버"]],
  ["fitzgerald","F. 스콧 피츠제럴드","F. Scott Fitzgerald","미국","1896–1940",["피츠제럴드","스콧 피츠제럴드"]],
  ["dostoevsky","표도르 도스토옙스키","Fyodor Dostoevsky","러시아","1821–1881",["도스토옙스키","도스토예프스키","dostoyevsky"]],
  ["chandler","레이먼드 챈들러","Raymond Chandler","미국","1888–1959",["챈들러"]],
  ["vonnegut","커트 보니것","Kurt Vonnegut","미국","1922–2007",["보니것","커트 보네거트"]],
  ["brautigan","리처드 브라우티건","Richard Brautigan","미국","1935–1984",["브라우티건"]],
  ["capote","트루먼 커포티","Truman Capote","미국","1924–1984",["커포티","카포티"]],
  ["chekhov","안톤 체호프","Anton Chekhov","러시아","1860–1904",["체호프"]],
  ["hemingway","어니스트 헤밍웨이","Ernest Hemingway","미국","1899–1961",["헤밍웨이"]],
  ["gardner","존 가드너","John Gardner","미국","1933–1982",[]],
  ["dinesen","이자크 디네센","Isak Dinesen","덴마크","1885–1962",["카렌 블릭센","Karen Blixen"]],
  ["twain","마크 트웨인","Mark Twain","미국","1835–1910",["트웨인"]],
  ["turgenev","이반 투르게네프","Ivan Turgenev","러시아","1818–1883",["투르게네프"]],
  ["tolstoy","레프 톨스토이","Leo Tolstoy","러시아","1828–1910",["톨스토이"]],
  ["stendhal","스탕달","Stendhal","프랑스","1783–1842",[]],
  ["stein","거트루드 스타인","Gertrude Stein","미국","1874–1946",[]],
  ["pound","에즈라 파운드","Ezra Pound","미국","1885–1972",[]],
  ["conrad","조지프 콘래드","Joseph Conrad","폴란드계 영국","1857–1924",["콘래드"]],
  ["keats","존 키츠","John Keats","영국","1795–1821",["키츠"]],
  ["pushkin","알렉산드르 푸시킨","Alexander Pushkin","러시아","1799–1837",["푸시킨","푸쉬킨"]],
  ["cervantes","미겔 데 세르반테스","Miguel de Cervantes","스페인","1547–1616",["세르반테스"]],
  ["hugo","빅토르 위고","Victor Hugo","프랑스","1802–1885",["위고"]],
  ["balzac","오노레 드 발자크","Honoré de Balzac","프랑스","1799–1850",["발자크"]],
  ["flaubert","귀스타브 플로베르","Gustave Flaubert","프랑스","1821–1880",["플로베르"]],
  ["kafka","프란츠 카프카","Franz Kafka","체코(보헤미아)","1883–1924",["카프카"]],
  ["kleist","하인리히 폰 클라이스트","Heinrich von Kleist","독일","1777–1811",["클라이스트"]],
  ["grillparzer","프란츠 그릴파르처","Franz Grillparzer","오스트리아","1791–1872",["그릴파르처"]],
  ["dickens","찰스 디킨스","Charles Dickens","영국","1812–1870",["디킨스"]],
  ["montaigne","미셸 드 몽테뉴","Michel de Montaigne","프랑스","1533–1592",["몽테뉴"]],

function addAuthor({ id, ko, en, nation, years, aliases = [] }) {
  id = id || "a_" + norm(en || ko);
  let a = authors.get(id);
  if (!a) { a = { id, ko: ko || en, en: en || "", nation: nation || "", years: years || "", mentions: [] }; authors.set(id, a); }
  else { a.en ||= en || ""; a.nation ||= nation || ""; a.years ||= years || ""; }

  const ids = new Set([...alias.entries()].filter(([key]) => key.endsWith(k) || key.startsWith(k)).map(([, id]) => id));
  return ids.size === 1 ? authors.get([...ids][0]) : null;
}

  return true;
}

function shortest(fromId, toId, undirected) {
  const prev = new Map([[fromId, null]]);
  const q = [fromId];
  while (q.length) {
    const cur = q.shift();
    if (cur === toId) break;
    const nexts = authors.get(cur).mentions.map(m => m.to);
    if (undirected) nexts.push(...backlinks(cur).map(a => a.id));
    for (const n of nexts) if (!prev.has(n)) { prev.set(n, cur); q.push(n); }
  }
  if (!prev.has(toId)) return null;
  const out = [];
  for (let c = toId; c; c = prev.get(c)) out.unshift(c);
  return out;
}

}

    }
  });
  // 초점 작가를 좋아한다고 밝힌 작가 중 이름난 몇 명을 흐리게
  const fid = focusId();
  backlinks(fid)
    .filter(a => !info.has(a.id) && visible(a.mentions.find(m => m.to === fid)))
    .sort((a, b) => fame(b.id) - fame(a.id))
    .slice(0, MAX_FANS)
    .forEach(a => {
      info.set(a.id, { role: "fan", age: 0 });
      newLinks.push({ s: a.id, t: fid, age: 0, fan: true, kind: kindOf(a.mentions.find(m => m.to === fid).kind) });
    });

  const focus = nodes.get(fid);
  const ox = focus ? focus.x : 0, oy = focus ? focus.y : 0;
  for (const [id, n] of nodes) if (!info.has(id)) { n.el.remove(); nodes.delete(id); }
  for (const [id, inf] of info) {
    let n = nodes.get(id);
    if (!n) {
      const parent = newLinks.find(l => l.t === id || l.s === id);
      const pid = parent ? (parent.t === id ? parent.s : parent.t) : null;
      const p = pid && nodes.get(pid);
      const a = Math.random() * Math.PI * 2;
      n = { id, x: (p ? p.x : ox) + Math.cos(a) * 40, y: (p ? p.y : oy) + Math.sin(a) * 40, vx: 0, vy: 0, r: 2, op: 0 };
      n.el = makeNode(n);
      nodes.set(id, n);
    }
    Object.assign(n, inf);
    const { r, op } = sizeFor(inf);
    n.tr = r; n.top = op;
    styleNode(n);
  }
  gLinks.replaceChildren();
  links = newLinks.filter(l => nodes.has(l.s) && nodes.has(l.t)).map(l => {
    const k = KINDS[l.kind];
    const el = document.createElementNS(NS, "line");
    el.setAttribute("stroke", k.color);
    el.setAttribute("stroke-linecap", "round");
    el.setAttribute("stroke-dasharray", k.dash);
    const w = l.fan ? k.width * 0.8 : l.onPath ? k.width + 1 : l.age === 0 ? k.width : k.width * 0.6;
    el.setAttribute("stroke-width", w);
    el.setAttribute("opacity", l.fan ? 0.35 : l.onPath ? 0.95 : Math.max(0.2, 0.85 - l.age * 0.22));
    const t = document.createElementNS(NS, "title");
    t.textContent = `${authors.get(l.s).ko} → ${authors.get(l.t).ko} · ${k.label}`;
    el.append(t);
    gLinks.append(el);
    return { ...l, el };
  });
  for (const n of nodes.values()) n.fixed = n.role === "focus";
  heat = 1;
  wake();
}

function sizeFor({ role, age }) {
  if (role === "focus") return { r: 30, op: 1 };
  if (role === "fan") return { r: 11, op: 0.42 };
  if (role === "path") return { r: Math.max(6, 22 * Math.pow(0.74, age)), op: Math.max(0.4, 1 - 0.14 * age) };
  if (age === 0) return { r: 15, op: 1 };
  return { r: Math.max(2.5, 8 * Math.pow(0.62, age - 1)), op: Math.max(0.18, 0.6 * Math.pow(0.7, age - 1)) };
}

function makeNode(n) {
  const g = document.createElementNS(NS, "g");
  g.setAttribute("class", "node");
  g.setAttribute("tabindex", "0");
  g.setAttribute("role", "button");
  const c = document.createElementNS(NS, "circle");
  const t = document.createElementNS(NS, "text");
  t.setAttribute("text-anchor", "middle");
  const title = document.createElementNS(NS, "title");
  g.append(title, c, t);
  g.addEventListener("click", e => { e.stopPropagation(); if (n.role !== "focus") go(n.id); });
  g.addEventListener("keydown", e => { if (e.key === "Enter" || e.key === " ") { e.preventDefault(); if (n.role !== "focus") go(n.id); } });
  g.addEventListener("pointerdown", e => e.stopPropagation());
  gNodes.append(g);
  return g;
}
function styleNode(n) {
  const a = authors.get(n.id);
  const [title, c, t] = n.el.children;
  title.textContent = `${a.ko}${a.en ? " · " + a.en : ""}${n.role === "fan" ? " — 지금 작가를 좋아한다고 밝힘" : ""}`;
  n.el.setAttribute("aria-label", `${a.ko}${n.role === "focus" ? " (지금 읽는 작가)" : n.role === "fan" ? " (지금 작가를 좋아한 작가)" : ""}`);
  const has = a.mentions.length > 0;
  c.setAttribute("stroke-dasharray", "");
  if (n.role === "focus") { c.setAttribute("fill", "var(--ink)"); c.setAttribute("stroke", "var(--ink)"); }
  else if (n.role === "path") { c.setAttribute("fill", "var(--faint)"); c.setAttribute("stroke", "var(--faint)"); }
  else if (n.role === "fan") { c.setAttribute("fill", "var(--ink-soft)"); c.setAttribute("stroke", "var(--edge-strong)"); }
  else { c.setAttribute("fill", "var(--bg)"); c.setAttribute("stroke", has ? "var(--edge-strong)" : "var(--edge)"); c.setAttribute("stroke-dasharray", has ? "" : "3 2"); }
  // 관심 작가는 진한 테로 구분한다
  const star = FEATURED.has(n.id) && n.role !== "focus";
  if (star) { c.setAttribute("stroke", "var(--ink)"); c.setAttribute("stroke-dasharray", ""); }
  c.setAttribute("stroke-width", star ? 2.6 : 1.5);
  const show = n.role === "focus" || n.role === "fan" || (n.role === "path" && n.age <= 5) || (n.role === "child" && n.age === 0);
  t.textContent = show ? a.ko : "";
  const fs = n.role === "focus" ? 15 : n.role === "path" ? Math.max(10, 13 - n.age) : n.role === "fan" ? 11.5 : 12.5;
  t.setAttribute("font-size", fs);
  t.setAttribute("font-weight", n.role === "focus" ? 600 : 400);
  t.setAttribute("fill", n.role === "path" || n.role === "fan" ? "var(--muted)" : "var(--fg)");
}

function tick() {
  const arr = [...nodes.values()];
  const alpha = 0.06 + heat * 0.5;
  for (let i = 0; i < arr.length; i++) for (let j = i + 1; j < arr.length; j++) {
    const a = arr[i], b = arr[j];
    let dx = b.x - a.x, dy = b.y - a.y, d2 = dx * dx + dy * dy || 0.01;
    const d = Math.sqrt(d2);
    const rep = (a.tr + b.tr + 8) * 28 / d2;
    const min = a.tr + b.tr + (a.role !== "path" && b.role !== "path" ? 26 : 10);
    let f = rep + (d < min ? (min - d) * 0.5 / d : 0);
    dx *= f * alpha; dy *= f * alpha;
    a.vx -= dx; a.vy -= dy; b.vx += dx; b.vy += dy;
  }
  for (const l of links) {
    const a = nodes.get(l.s), b = nodes.get(l.t);
    const want = l.fan ? 175 : l.onPath ? 150 : l.age === 0 ? 120 + b.tr * 2 : 30 + a.tr + b.tr * 3;
    const dx = b.x - a.x, dy = b.y - a.y, d = Math.hypot(dx, dy) || 0.01;
    const f = (d - want) / d * 0.06 * alpha * 4;
    a.vx += dx * f * 0.5; a.vy += dy * f * 0.5; b.vx -= dx * f * 0.5; b.vy -= dy * f * 0.5;
  }
  for (const n of arr) {
    if (n.role === "path") { n.vx += (-n.age * 170 - n.x) * 0.06; n.vy += (0 - n.y) * 0.04; }
    if (n.role === "fan") { n.vy += (-160 - n.y) * 0.008; }   // 좋아한 작가들은 위쪽에 흐리게
    if (n.fixed) { n.vx += (0 - n.x) * 0.2; n.vy += (0 - n.y) * 0.2; }
    const damp = 0.82 * Math.min(1, 0.6 + heat * 2);
    n.vx *= damp; n.vy *= damp;
    n.x += n.vx; n.y += n.vy;
    n.r += (n.tr - n.r) * 0.12;
    n.op += (n.top - n.op) * 0.12;
  }
  heat *= 0.985;
  view.x += (viewTarget.x - view.x) * 0.1;
  view.y += (viewTarget.y - view.y) * 0.1;
  view.k += (viewTarget.k - view.k) * 0.1;
  draw();
  // 움직임이 거의 없으면 멈춘다 — 매 프레임 DOM을 고치느라 입력이 밀리지 않도록
  let motion = Math.abs(viewTarget.x - view.x) + Math.abs(viewTarget.y - view.y) + Math.abs(viewTarget.k - view.k) * 100;
  for (const n of arr) motion = Math.max(motion, Math.abs(n.tr - n.r), Math.abs(n.top - n.op) * 10);
  if (heat < 0.02 && motion < 0.05) { running = false; return; }
  requestAnimationFrame(tick);
}
function draw() {
  const w = svg.clientWidth, h = svg.clientHeight;
  gRoot.setAttribute("transform", `translate(${w / 2 + view.x},${h / 2 + view.y}) scale(${view.k})`);
  for (const l of links) {
    const a = nodes.get(l.s), b = nodes.get(l.t);
    l.el.setAttribute("x1", a.x); l.el.setAttribute("y1", a.y);
    l.el.setAttribute("x2", b.x); l.el.setAttribute("y2", b.y);
  }
  for (const n of nodes.values()) {
    n.el.setAttribute("transform", `translate(${n.x},${n.y})`);
    n.el.setAttribute("opacity", n.op.toFixed(3));
    const [, c, t] = n.el.children;
    c.setAttribute("r", n.r.toFixed(2));
    t.setAttribute("y", (n.r + 15).toFixed(1));
  }
}
function centerOnFocus() {
  wake();
  const w = svg.clientWidth;
  viewTarget.k = w < 560 ? 0.68 : 1;
  viewTarget.x = path.length > 1 ? Math.min(w * 0.12, 120) : 0;
  viewTarget.y = -20;
}

let drag = null;
svg.addEventListener("pointerdown", e => { drag = { x: e.clientX, y: e.clientY, vx: viewTarget.x, vy: viewTarget.y }; svg.setPointerCapture(e.pointerId); svg.classList.add("dragging"); });
svg.addEventListener("pointermove", e => { if (!drag) return; viewTarget.x = drag.vx + e.clientX - drag.x; viewTarget.y = drag.vy + e.clientY - drag.y; view.x = viewTarget.x; view.y = viewTarget.y; wake(); });
const endDrag = () => { drag = null; svg.classList.remove("dragging"); };
svg.addEventListener("pointerup", endDrag); svg.addEventListener("pointercancel", endDrag);
svg.addEventListener("wheel", e => {
  e.preventDefault();
  const k = Math.min(2.5, Math.max(0.25, viewTarget.k * Math.exp(-e.deltaY * 0.0015)));
  const rect = svg.getBoundingClientRect();
  const mx = e.clientX - rect.left - rect.width / 2, my = e.clientY - rect.top - rect.height / 2;
  viewTarget.x = mx - (mx - viewTarget.x) * k / viewTarget.k;
  viewTarget.y = my - (my - viewTarget.y) * k / viewTarget.k;
  viewTarget.k = k;
  wake();
}, { passive: false });
document.getElementById("recenter").onclick = centerOnFocus;
document.getElementById("back").onclick = () => { if (path.length > 1) go(path[path.length - 2]); };

function renderLegend() {

    `<button type="button" class="kind-toggle" data-kind="${k}" aria-pressed="${!hiddenKinds.has(k)}" title="${v.label} 선 켜기/끄기">${lineSwatch(k)}${v.label}</button>`).join("") +
    `<span class="note-dot"><i style="background:var(--ink-soft);border:1px solid var(--edge-strong)"></i>흐린 원: 이 작가를 좋아한 작가</span>` +
    `<span class="note-dot"><i style="background:var(--bg);border:2.5px solid var(--ink)"></i>진한 테: 관심 작가</span>`;

/* 자체 자동완성 — datalist는 한글 조합 입력에서 느리고 화면을 밀어내서 쓰지 않는다 */
function suggestions(text) {
  const k = norm(text);
  if (!k) return [];
  const keysOf = new Map();
  for (const [key, id] of alias) (keysOf.get(id) || keysOf.set(id, []).get(id)).push(key);
  const hits = [];
  for (const a of authors.values()) {
    const keys = [norm(a.ko), norm(a.en), ...(keysOf.get(a.id) || [])];
    const rank = keys.some(x => x.startsWith(k)) ? 0 : keys.some(x => x.includes(k)) ? 1 : -1;
    if (rank >= 0) hits.push([rank, a]);
  }
  return hits.sort((x, y) => x[0] - y[0] || x[1].ko.localeCompare(y[1].ko, "ko")).slice(0, 8).map(h => h[1]);
}
const closeSuggest = () => document.querySelectorAll(".suggest ul").forEach(u => { u.hidden = true; });
function attachSuggest(input, onPick) {
  const ul = document.createElement("ul");
  ul.setAttribute("role", "listbox");
  ul.hidden = true;
  input.after(ul);
  input.setAttribute("role", "combobox");
  input.setAttribute("aria-autocomplete", "list");
  input.setAttribute("aria-expanded", "false");
  let items = [], sel = -1, frame = 0;
  const close = () => { ul.hidden = true; sel = -1; input.setAttribute("aria-expanded", "false"); };
  const paint = () => {
    ul.innerHTML = items.map((a, i) => `<li role="option" data-i="${i}" aria-selected="${i === sel}">${esc(a.ko)}<small>${esc(a.en)}</small></li>`).join("");
    ul.hidden = !items.length;
    input.setAttribute("aria-expanded", String(!!items.length));
  };
  const pick = a => { input.value = a.ko; close(); onPick?.(a); };
  input.addEventListener("input", () => {
    cancelAnimationFrame(frame);
    frame = requestAnimationFrame(() => { items = suggestions(input.value); sel = -1; paint(); });
  });
  input.addEventListener("keydown", e => {
    if (e.isComposing || e.keyCode === 229) return;   // 한글 조합 중에는 손대지 않는다
    if (ul.hidden) return;
    if (e.key === "ArrowDown" || e.key === "ArrowUp") {
      e.preventDefault();
      sel = (sel + (e.key === "ArrowDown" ? 1 : -1) + items.length) % items.length;
      paint();
    } else if (e.key === "Enter" && sel >= 0) { e.preventDefault(); pick(items[sel]); }
    else if (e.key === "Escape") close();
  });
  ul.addEventListener("pointerdown", e => {
    const li = e.target.closest("li");
    if (!li) return;
    e.preventDefault();
    pick(items[+li.dataset.i]);
  });
  input.addEventListener("blur", close);
}
document.getElementById("searchForm").onsubmit = e => {
  e.preventDefault();
  closeSuggest();
  const q = document.getElementById("q").value.trim();
  if (!q) return;
  const a = findAuthor(q) || addAuthor({ ko: q });
  document.getElementById("q").value = "";
  flash = ""; showForm = false;
  startNew(a.id);
  if (!a.mentions.length && sample) askClaude(a.id, "likes");
};
document.getElementById("routeForm").onsubmit = e => {
  e.preventDefault();
  closeSuggest();
  const fromIn = document.getElementById("r-from"), toIn = document.getElementById("r-to");
  const A = findAuthor(fromIn.value), B = findAuthor(toIn.value);
  showForm = false;
  if (!A || !B) { flash = `${!A ? fromIn.value || "출발 작가" : toIn.value || "도착 작가"}을(를) 서가에서 찾지 못했습니다. 목록에 있는 이름을 골라 주세요.`; renderPage(); return; }
  let ids = shortest(A.id, B.id, false), undirected = false;
  if (!ids) { ids = shortest(A.id, B.id, true); undirected = true; }
  if (!ids) { flash = `${A.ko}와 ${B.ko} 사이에 아직 이어진 길이 없습니다. Claude 찾기나 직접 추가로 서가를 넓혀 보세요.`; renderPage(); return; }
  flash = "";
  route = { ids, undirected };
  setPath(ids);
};
